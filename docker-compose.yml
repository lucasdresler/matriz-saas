services:
  # 1. Painel Web / Dashboard SaaS
  matriz-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matriz-saas
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://matriz_admin:MatrizSecurePass2026!@postgres:5432/matriz_db?schema=public
      - NEXT_PUBLIC_EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=MatrizSuperSecretApiKey2026
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    networks:
      - matriz-network

  # 2. WhatsApp Gateway (Evolution API v2 - Suporte Nativo ARM64)
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=MatrizSuperSecretApiKey2026
      # Banco de dados para Evolution API
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://matriz_admin:MatrizSecurePass2026!@postgres:5432/matriz_db?schema=evolution
      - DATABASE_CLIENT_NAME=evolution_v2
      # Cache e Fila com Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      # Configurações do WhatsApp
      - CONFIG_SESSION_PHONE_CLIENT=AllLogic Online
      - CONFIG_SESSION_PHONE_NAME=AllLogic Atendimento
      - QRCODE_LIMIT=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - matriz-network

  # 3. Banco de Dados PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: matriz-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=matriz_admin
      - POSTGRES_PASSWORD=MatrizSecurePass2026!
      - POSTGRES_DB=matriz_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matriz_admin -d matriz_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - matriz-network

  # 4. Redis para filas de mensagens e alta performance
  redis:
    image: redis:7-alpine
    container_name: matriz-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - matriz-network

volumes:
  postgres_data:
  redis_data:

networks:
  matriz-network:
    driver: bridge
